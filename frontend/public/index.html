<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="KubeAI application" />

  <!-- Favicon links - order matters -->
  <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
  <link rel="shortcut icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <title>KubeAI</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>
<script>
  // Force favicon refresh - place this at the end of body
  function updateFavicon() {
    const timestamp = new Date().getTime();
    const links = document.querySelectorAll("link[rel*='icon']");
    links.forEach(link => {
      if (link.rel.includes('icon')) {
        link.href = `%PUBLIC_URL%/favicon.ico?v=${timestamp}`;
      }
    });
  }
  window.onload = updateFavicon;
</script>

</html>
